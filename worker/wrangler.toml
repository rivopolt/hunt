name = "jaljed-api"
main = "index.js"
compatibility_date = "2024-01-01"

# Non-secret settings. Fill these in for your repo, then run
# `wrangler secret put GITHUB_TOKEN` separately (never put the token
# itself in this file — it would end up committed to git).
[vars]
GITHUB_REPO = "rivopolt/hunt"
GITHUB_BRANCH = "main"
FILE_PATH = "data/registrations_all.geojson"
ALLOWED_ORIGIN = "https://rivopolt.github.io"
