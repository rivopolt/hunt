name: Merge wildlife-track registrations

# Runs whenever files change under data/registrations/, and merges every
# *.geojson file there into a single data/registrations_all.geojson
# FeatureCollection — that merged file is what the app actually loads.
#
# Each registration is its own small file (one Feature) so that two
# people pushing around the same time never conflict with each other's
# edits — the merge step just re-reads the whole folder and rebuilds
# the combined file from scratch every time.

on:
  push:
    branches: [main, master]
    paths:
      - "data/registrations/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  merge-registrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge registration files
        run: |
          python3 - <<'PYEOF'
          import json
          import glob
          import os

          features = []
          for path in sorted(glob.glob("data/registrations/*.geojson")):
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
              except (json.JSONDecodeError, OSError) as e:
                  print(f"Skipping {path}: {e}")
                  continue

              if data.get("type") == "FeatureCollection":
                  feats = data.get("features", [])
              elif data.get("type") == "Feature":
                  feats = [data]
              else:
                  print(f"Skipping {path}: not a Feature/FeatureCollection")
                  continue

              for feat in feats:
                  feat.setdefault("properties", {})
                  # Tag every feature with the source filename so a bad
                  # entry can be traced back to the file that produced it.
                  feat["properties"]["_source_file"] = os.path.basename(path)
                  features.append(feat)

          merged = {"type": "FeatureCollection", "features": features}
          with open("data/registrations_all.geojson", "w", encoding="utf-8") as f:
              json.dump(merged, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Merged {len(features)} feature(s) from data/registrations/")
          PYEOF

      - name: Commit merged file if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-merge data/registrations_all.geojson"
          file_pattern: "data/registrations_all.geojson"
